<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SCG · Locker Room</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito+Sans:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root{--navy:#2d3280;--navy-d:#1e2260;--navy-l:#3d43a0;--orange:#e8521a;--orange-l:#ff6b35;--cream:#fdf8f3;--paper:#f0ebe2;--ink:#1a1a2e;--muted:#9399b8;--border:#ddd6c8;--green:#16a34a;--red:#dc2626;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;overflow-x:hidden;}
header{background:var(--navy);padding:0 20px;box-shadow:0 3px 20px rgba(45,50,128,.3);}
.header-inner{max-width:900px;margin:0 auto;padding:14px 0;display:flex;align-items:center;justify-content:space-between;}
.brand{display:flex;align-items:center;gap:12px;}
.brand-text-top{display:flex;align-items:baseline;gap:4px;}
.brand-text-top span:first-child{font-size:18px;font-weight:900;color:#fff;}
.brand-text-top span:last-child{font-size:18px;font-weight:900;color:var(--orange);}
.brand-sub-line{font-size:18px;font-weight:900;color:#fff;line-height:1;}
.brand-caption{font-size:10px;color:rgba(255,255,255,.45);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;}
.header-right{display:flex;align-items:center;gap:10px;}
.admin-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);padding:7px 14px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Nunito Sans',sans-serif;transition:all .15s;}
.admin-btn:hover{background:rgba(255,255,255,.2);color:#fff;}
.export-btn{background:var(--orange);border:none;color:#fff;padding:7px 14px;border-radius:6px;font-size:12px;font-weight:800;cursor:pointer;font-family:'Nunito Sans',sans-serif;}
.accent-bar{height:4px;background:linear-gradient(90deg,var(--orange),var(--orange-l),var(--navy));}
.scoreboard{background:var(--navy-d);padding:10px 20px;border-bottom:2px solid var(--orange);}
.scoreboard-inner{max-width:900px;margin:0 auto;display:flex;gap:24px;align-items:center;overflow-x:auto;}
.score-item{display:flex;align-items:center;gap:8px;white-space:nowrap;}
.score-item .val{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--orange);}
.score-item .lbl{font-size:10px;color:rgba(255,255,255,.45);font-weight:700;letter-spacing:1px;text-transform:uppercase;font-family:'JetBrains Mono',monospace;}
.score-divider{width:1px;height:24px;background:rgba(255,255,255,.1);}
.room-wrap{max-width:900px;margin:0 auto;padding:24px 20px;}
.room-title{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:3px;color:var(--muted);margin-bottom:16px;display:flex;align-items:center;gap:10px;}
.room-title::after{content:'';flex:1;height:1px;background:var(--border);}
.locker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;}
.locker{background:#fff;border:2px solid var(--border);border-radius:10px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;user-select:none;}
.locker:hover{border-color:var(--navy);transform:translateY(-2px);box-shadow:0 6px 20px rgba(45,50,128,.15);}
.locker.has-activity{border-color:var(--navy);}
.locker.all-done{border-color:var(--green);background:#f0fdf4;}
.locker-top{background:var(--navy);padding:10px 12px 8px;position:relative;}
.locker.all-done .locker-top{background:var(--green);}
.locker-number{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:2px;color:rgba(255,255,255,.4);}
.locker-name{font-size:14px;font-weight:900;color:#fff;line-height:1.2;margin-top:2px;}
.locker-handle{width:20px;height:8px;background:rgba(255,255,255,.15);border-radius:4px;margin:6px auto 0;}
.locker-body{padding:10px 12px;}
.locker-bar-wrap{height:4px;background:var(--paper);border-radius:2px;overflow:hidden;margin-bottom:4px;}
.locker-fill{height:4px;background:var(--orange);border-radius:2px;transition:width .4s;}
.locker.all-done .locker-fill{background:var(--green);}
.locker-count{font-size:11px;font-weight:700;color:var(--muted);font-family:'JetBrains Mono',monospace;}
.locker-stamps{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;}
.mini-stamp{width:10px;height:10px;border-radius:2px;background:var(--paper);}
.mini-stamp.done{background:var(--orange);}
.locker.all-done .mini-stamp.done{background:var(--green);}
.done-badge{position:absolute;top:6px;right:6px;background:var(--orange);color:#fff;font-size:8px;font-weight:800;padding:1px 5px;border-radius:3px;font-family:'JetBrains Mono',monospace;}
.overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(15,15,30,.7);align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);}
.overlay.open{display:flex;}
.pin-box,.setup-box{background:#fff;border-radius:16px;padding:28px 24px;width:100%;max-width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.pin-title{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--navy);letter-spacing:2px;margin-bottom:4px;}
.pin-sub{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:20px;}
.pin-dots{display:flex;justify-content:center;gap:12px;margin-bottom:20px;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);transition:all .15s;}
.pin-dot.filled{background:var(--navy);border-color:var(--navy);}
.pin-dot.error{background:var(--red);border-color:var(--red);}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.pin-key{background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:20px;font-weight:800;cursor:pointer;transition:all .1s;font-family:'Bebas Neue',sans-serif;}
.pin-key:hover{background:var(--navy);color:#fff;border-color:var(--navy);}
.pin-key:active{transform:scale(.94);}
.pin-key.del{font-size:14px;color:var(--muted);}
.pin-key.del:hover{background:var(--red);color:#fff;border-color:var(--red);}
.pin-hint{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
.pin-reset{color:var(--orange);font-weight:700;cursor:pointer;}
.pin-error{font-size:12px;color:var(--red);font-weight:700;margin-bottom:10px;min-height:18px;}
.pin-cancel{margin-top:12px;background:transparent;border:none;color:var(--muted);font-size:13px;cursor:pointer;font-family:'Nunito Sans',sans-serif;font-weight:600;}
.panel-box{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.panel-hdr{background:var(--navy);padding:18px 20px;border-radius:16px 16px 0 0;position:sticky;top:0;z-index:2;}
.panel-name{font-family:'Bebas Neue',sans-serif;font-size:26px;color:#fff;letter-spacing:2px;}
.panel-sub{font-size:11px;color:rgba(255,255,255,.5);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-top:2px;}
.panel-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.15);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;}
.panel-body{padding:20px;}
.punch-card{border:2px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden;}
.punch-card.done{border-color:var(--green);}
.punch-card.closed{opacity:.6;}
.punch-top{display:flex;align-items:center;gap:12px;padding:14px 16px;}
.punch-hole{width:36px;height:36px;border-radius:50%;border:3px dashed var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.punch-card.done .punch-hole{border-color:var(--green);background:#f0fdf4;}
.punch-icon{font-size:18px;opacity:0;transform:scale(0);transition:all .3s;}
.punch-card.done .punch-icon{opacity:1;transform:scale(1);}
.punch-info{flex:1;}
.punch-title{font-size:14px;font-weight:800;margin-bottom:3px;}
.punch-due{font-size:11px;color:var(--muted);font-weight:600;font-family:'JetBrains Mono',monospace;}
.punch-badges{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;}
.pbadge{font-size:9px;font-weight:800;letter-spacing:1px;padding:2px 7px;border-radius:3px;text-transform:uppercase;}
.pbadge-open{background:#dcfce7;color:var(--green);}
.pbadge-closed{background:#fee2e2;color:var(--red);}
.pbadge-time{background:#fff7ed;color:var(--orange);}
.punch-btn{padding:8px 16px;border-radius:7px;border:none;font-family:'Nunito Sans',sans-serif;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap;}
.punch-btn.can{background:var(--orange);color:#fff;}
.punch-btn.stamped{background:#dcfce7;color:var(--green);cursor:default;}
.punch-btn.over{background:var(--paper);color:var(--muted);cursor:default;}
.punch-divider{height:1px;background:var(--paper);margin:0 16px;}
.punch-footer{padding:10px 16px;background:var(--paper);display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.punch-footer:hover{background:#e8e2d6;}
.punch-footer-txt{font-size:11px;color:var(--muted);font-weight:700;font-family:'JetBrains Mono',monospace;}
.punch-members{padding:10px 16px 14px;display:flex;flex-wrap:wrap;gap:6px;}
.pmtag{font-size:11px;padding:3px 9px;border-radius:4px;font-weight:700;}
.pmtag-done{background:#dcfce7;color:var(--green);}
.pmtag-miss{background:#fee2e2;color:var(--red);}
.pmtag-pend{background:var(--paper);color:var(--muted);}
@keyframes stampIn{0%{transform:scale(2) rotate(-15deg);opacity:0;}60%{transform:scale(.9) rotate(3deg);}100%{transform:scale(1) rotate(0);opacity:1;}}
.stamp-anim{animation:stampIn .35s ease forwards;}
.admin-box{background:#fff;border-radius:16px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.admin-hdr{background:var(--navy-d);padding:18px 20px;border-radius:16px 16px 0 0;position:sticky;top:0;}
.admin-hdr-title{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fff;letter-spacing:2px;}
.admin-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.1);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;}
.admin-body{padding:20px;}
.admin-section{margin-bottom:24px;}
.admin-section-title{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;font-family:'JetBrains Mono',monospace;}
input,select{background:var(--paper);border:1.5px solid var(--border);color:var(--ink);border-radius:8px;padding:9px 13px;font-family:'Nunito Sans',sans-serif;font-size:14px;outline:none;width:100%;}
input:focus,select:focus{border-color:var(--navy);background:#fff;}
input::placeholder{color:var(--muted);}
.btn{font-family:'Nunito Sans',sans-serif;font-weight:800;font-size:13px;padding:9px 18px;border-radius:7px;border:none;cursor:pointer;}
.btn-navy{background:var(--navy);color:#fff;}
.btn-orange{background:var(--orange);color:#fff;}
.btn-red{background:#fee2e2;color:var(--red);}
.btn-green{background:#dcfce7;color:var(--green);}
.admin-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--paper);}
.admin-row:last-child{border:none;}
.export-box{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.export-box textarea{width:100%;min-height:200px;font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--paper);border:1.5px solid var(--border);border-radius:8px;padding:12px;resize:none;color:var(--ink);outline:none;line-height:1.7;}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:999;padding:11px 22px;border-radius:30px;font-size:13px;font-weight:700;color:#fff;display:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.2);}
@media(max-width:480px){.locker-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));}.header-right{gap:6px;}.admin-btn,.export-btn{font-size:11px;padding:6px 10px;}}
</style>
</head>
<body>
<div id="toast"></div>
<div class="overlay" id="ov-pin"><div id="pin-wrap"></div></div>
<div class="overlay" id="ov-panel"><div class="panel-box" id="panel-wrap"></div></div>

      <button id="btn-close-export" style="background:transparent;border:none;font-size:20px;cursor:pointer;color:var(--muted)">&#10005;</button>

      <button class="btn" id="btn-close-export2" style="background:var(--paper);color:var(--muted)">Close</button>

</div>
<header>
  <div class="header-inner">
    <div class="brand" id="scg-logo" style="cursor:default;user-select:none">

        <line x1="65" y1="41" x2="71" y2="35" stroke="#e8521a" stroke-width="5" stroke-linecap="round"/>

        <path d="M26 52 Q26 28 50 26 Q74 28 74 52" fill="#2d3280"/>

</header>
<div class="accent-bar"></div>

  <div class="score-item"><div class="val" id="sc-members">0</div><div class="lbl">Members</div></div>

</div></div>

</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const FB = {
  apiKey: "AIzaSyDYuommjN2ggBg4Oks9gk_TDwWRPP0UFNc",
  authDomain: "sgc-checkin-2d966.firebaseapp.com",
  databaseURL: "https://sgc-checkin-2d966-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sgc-checkin-2d966",
  storageBucket: "sgc-checkin-2d966.firebasestorage.app",
  messagingSenderId: "88375703988",
  appId: "1:88375703988:web:fe75ea62c465262fbbdae1"
};
const app = initializeApp(FB);
const db = getDatabase(app);
const dbRef = ref(db, "scg_lockers_v1");

const DEFAULTS = {
  members:[
    {name:"Mathias",pin:"1234"},{name:"Ama",pin:"1111"},{name:"Kofi",pin:"2222"},
    {name:"Akosua",pin:"3333"},{name:"Kwame",pin:"4444"},{name:"Abena",pin:"5555"},
    {name:"Yaw",pin:"6666"},{name:"Efua",pin:"7777"},{name:"Nana",pin:"8888"},{name:"Fiifi",pin:"9999"}
  ],
  assignments:[
    {id:1,title:"Safety Management Systems Summary",deadline:new Date(Date.now()+2*86400000).toISOString(),checkins:[]},
    {id:2,title:"Risk Assessment Write-up",deadline:new Date(Date.now()+5*86400000).toISOString(),checkins:[]}
  ]
};

let state = {members:[],assignments:[]};
let panelMember = null;
let expandedId = null;
let pinMember = null;
let pinEntered = "";
let pinMode = "verify";
let pinStep = 0;
let pinNew = "";
let adminUnlocked = false;
let adminEntered = "";
let toastTimer;

// ── FIREBASE ────────────────────────────────────────
function save() { set(dbRef, state); }

function normalize(data) {
  state.members = Array.isArray(data.members) ? data.members : Object.values(data.members||{});
  state.assignments = Array.isArray(data.assignments) ? data.assignments : Object.values(data.assignments||{});
  state.assignments = state.assignments.map(function(a) {
    return Object.assign({}, a, {
      checkins: Array.isArray(a.checkins) ? a.checkins : Object.values(a.checkins||{})
    });
  });
}

onValue(dbRef, function(snap) {
  var data = snap.val();
  if (!data) { state = JSON.parse(JSON.stringify(DEFAULTS)); save(); }
  else { normalize(data); }
  renderLockers();
  if (panelMember && document.getElementById("ov-panel").classList.contains("open")) renderPanel();
  if (document.getElementById("ov-admin").classList.contains("open")) renderAdmin();
});

// ── HELPERS ─────────────────────────────────────────
function esc(s) { var d=document.createElement("div"); d.textContent=String(s); return d.innerHTML; }
function fmt(iso) { return new Date(iso).toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); }
function isClosed(a) {
  if (a.forceClosed===true) return true;
  if (a.forceOpen===true) return false;
  return new Date() > new Date(a.deadline);
}
function timeLeft(dl) {
  var d = new Date(dl)-new Date(); if (d<=0) return null;
  var h = Math.floor(d/3600000); return h<24 ? h+"h left" : Math.floor(h/24)+"d left";
}
function isUrgent(dl) { var d=new Date(dl)-new Date(); return d>0 && d<=12*3600000; }
function toast(msg, type) {
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.style.background = type==="error" ? "#dc2626" : type==="info" ? "#2d3280" : "#16a34a";
  el.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.style.display="none"; }, 2800);
}
function el(tag, attrs, txt) {
  var e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k){ e.setAttribute(k, attrs[k]); });
  if (txt !== undefined) e.textContent = txt;
  return e;
}
function div(cls) { var d=document.createElement("div"); if(cls) d.className=cls; return d; }
function btn(cls, txt, fn) { var b=document.createElement("button"); b.className=cls; b.textContent=txt; b.onclick=fn; return b; }

// ── SCOREBOARD ──────────────────────────────────────
function renderScoreboard() {
  document.getElementById("sc-members").textContent = state.members.length;
  document.getElementById("sc-assignments").textContent = state.assignments.length;
  document.getElementById("sc-checkins").textContent = state.assignments.reduce(function(s,a){ return s+a.checkins.length; },0);
  var all = state.members.filter(function(m){ return state.assignments.length>0 && state.assignments.every(function(a){ return a.checkins.indexOf(m.name)>-1; }); }).length;
  document.getElementById("sc-complete").textContent = all;
}

// ── LOCKERS ─────────────────────────────────────────
function renderLockers() {
  renderScoreboard();
  var grid = document.getElementById("locker-grid");
  grid.innerHTML = "";
  state.members.forEach(function(m, i) {
    var done = state.assignments.filter(function(a){ return a.checkins.indexOf(m.name)>-1; }).length;
    var total = state.assignments.length;
    var pct = total ? Math.round(done/total*100) : 0;
    var allDone = total>0 && done===total;
    var hasAct = done>0;

    var card = div("locker" + (allDone?" all-done":hasAct?" has-activity":""));
    card.onclick = function(){ openLocker(m.name); };

    var top = div("locker-top");
    var num = div("locker-number"); num.textContent = "#"+String(i+1).padStart(2,"0"); top.appendChild(num);
    var nm = div("locker-name"); nm.textContent = m.name; top.appendChild(nm);
    var handle = div("locker-handle"); top.appendChild(handle);
    if (allDone) { var badge = div("done-badge"); badge.textContent="ALL DONE"; top.appendChild(badge); }
    card.appendChild(top);

    var body = div("locker-body");
    var barWrap = div("locker-bar-wrap");
    var fill = div("locker-fill"); fill.style.width = pct+"%"; barWrap.appendChild(fill);
    body.appendChild(barWrap);
    var count = div("locker-count"); count.textContent = done+"/"+total+" DONE"; body.appendChild(count);
    var stamps = div("locker-stamps");
    state.assignments.forEach(function(a){
      var s = div("mini-stamp"+(a.checkins.indexOf(m.name)>-1?" done":""));
      stamps.appendChild(s);
    });
    body.appendChild(stamps);
    card.appendChild(body);
    grid.appendChild(card);
  });
}

// ── PIN SYSTEM ───────────────────────────────────────
function makePinUI(title, sub, handler, showReset) {
  var wrap = div("pin-box");
  var ttl = div("pin-title"); ttl.textContent = title; wrap.appendChild(ttl);
  var sub_ = div("pin-sub"); sub_.textContent = sub; wrap.appendChild(sub_);
  var dots = div("pin-dots"); dots.id = "pin-dots";
  for (var i=0;i<4;i++) { dots.appendChild(div("pin-dot")); }
  wrap.appendChild(dots);
  var err = div("pin-error"); err.id = "pin-error"; wrap.appendChild(err);
  var pad = div("pin-pad");
  [1,2,3,4,5,6,7,8,9,null,0,"DEL"].forEach(function(k) {
    if (k===null) { pad.appendChild(div("")); return; }
    var b = document.createElement("button");
    b.className = "pin-key" + (k==="DEL"?" del":"");
    b.textContent = k==="DEL" ? "⌫" : k;
    b.onclick = function(){ handler(k); };
    pad.appendChild(b);
  });
  wrap.appendChild(pad);
  if (showReset) {
    var hint = div("pin-hint");
    hint.textContent = "Forgot your PIN? ";
    var sp = document.createElement("span"); sp.className="pin-reset"; sp.textContent="Reset it";
    sp.onclick = function(){ doResetPin(); };
    hint.appendChild(sp);
    wrap.appendChild(hint);
  }
  var cancel = document.createElement("button"); cancel.className="pin-cancel"; cancel.textContent="Cancel";
  cancel.onclick = function(){ closeOverlay("ov-pin"); };
  wrap.appendChild(cancel);
  return wrap;
}

function updatePinDots(entered) {
  var dots = document.querySelectorAll("#pin-dots .pin-dot");
  dots.forEach(function(d,i){ d.className="pin-dot"+(i<entered.length?" filled":""); });
}

function showPinError(msg) {
  var dots = document.querySelectorAll("#pin-dots .pin-dot");
  dots.forEach(function(d){ d.className="pin-dot error"; });
  var e = document.getElementById("pin-error"); if(e) e.textContent=msg;
  setTimeout(function(){ dots.forEach(function(d){ d.className="pin-dot"; }); }, 600);
}

function openLocker(name) {
  var m = state.members.find(function(x){ return x.name===name; });
  if (!m) return;
  pinMember=m; pinEntered=""; pinMode=m.pin?"verify":"setup"; pinStep=0; pinNew="";
  renderPinBox();
  document.getElementById("ov-pin").classList.add("open");
}

function renderPinBox() {
  var wrap = document.getElementById("pin-wrap");
  wrap.innerHTML = "";
  var sub = pinMode==="setup" ? (pinStep===0 ? "Set a 4-digit PIN for your locker." : "Confirm your PIN") : "Enter your 4-digit PIN";
  var ui = makePinUI(pinMember.name, sub, handlePinKey, pinMode==="verify");
  wrap.appendChild(ui);
  updatePinDots(pinEntered);
}

function handlePinKey(k) {
  if (k==="DEL") { pinEntered=pinEntered.slice(0,-1); updatePinDots(pinEntered); return; }
  if (pinEntered.length>=4) return;
  pinEntered += String(k);
  updatePinDots(pinEntered);
  if (pinEntered.length===4) setTimeout(submitPin, 120);
}

function submitPin() {
  if (pinMode==="setup") {
    if (pinStep===0) {
      pinNew=pinEntered; pinEntered=""; pinStep=1; renderPinBox();
    } else {
      if (pinEntered===pinNew) {
        pinMember.pin=pinNew; save();
        closeOverlay("ov-pin"); toast("PIN set! Opening your locker...");
        setTimeout(function(){ openPanel(pinMember.name); }, 400);
      } else {
        showPinError("PINs do not match. Try again.");
        pinEntered=""; pinStep=0; pinNew="";
        setTimeout(renderPinBox, 600);
      }
    }
  } else {
    if (pinEntered===pinMember.pin) { closeOverlay("ov-pin"); openPanel(pinMember.name); }
    else { showPinError("Wrong PIN. Try again."); pinEntered=""; setTimeout(renderPinBox,600); }
  }
}

function doResetPin() {
  var m = state.members.find(function(x){ return x.name===pinMember.name; });
  if (!m) return;
  m.pin=""; save();
  pinMode="setup"; pinStep=0; pinNew=""; pinEntered="";
  renderPinBox();
}

// ── PANEL ────────────────────────────────────────────
function openPanel(name) {
  panelMember=name; renderPanel();
  document.getElementById("ov-panel").classList.add("open");
}

function renderPanel() {
  var wrap = document.getElementById("panel-wrap");
  wrap.innerHTML="";
  var name = panelMember;
  var doneCount = state.assignments.filter(function(a){ return a.checkins.indexOf(name)>-1; }).length;
  var total = state.assignments.length;

  // Header
  var hdr = div("panel-hdr"); hdr.style.position="relative";
  var closeBtn = document.createElement("button"); closeBtn.className="panel-close"; closeBtn.textContent="✕";
  closeBtn.onclick=function(){ closeOverlay("ov-panel"); expandedId=null; };
  hdr.appendChild(closeBtn);
  var nm = div("panel-name"); nm.textContent = "📂 "+name+"'s Locker"; hdr.appendChild(nm);
  var sub = div("panel-sub"); sub.textContent = doneCount+"/"+total+" Assignments Stamped"; hdr.appendChild(sub);
  wrap.appendChild(hdr);

  var body = div("panel-body");
  if (!state.assignments.length) {
    var emp = div(""); emp.style.cssText="text-align:center;padding:30px;color:var(--muted)";
    emp.textContent="No assignments yet. Ask your admin to add some.";
    body.appendChild(emp);
  } else {
    state.assignments.forEach(function(a) {
      var closed = isClosed(a);
      var done = a.checkins.indexOf(name)>-1;
      var tl = timeLeft(a.deadline);
      var urgent = isUrgent(a.deadline);
      var pct = state.members.length ? Math.round(a.checkins.length/state.members.length*100) : 0;
      var expanded = expandedId===a.id;

      var card = div("punch-card"+(done?" done":"")+(closed?" closed":""));

      // Top row
      var top = div("punch-top");
      var hole = div("punch-hole");
      var icon = div("punch-icon"+(done?" stamp-anim":"")); icon.textContent="✅"; hole.appendChild(icon);
      top.appendChild(hole);

      var info = div("punch-info");
      var ptitle = div("punch-title"); ptitle.textContent=a.title; info.appendChild(ptitle);
      var pdue = div("punch-due");
      pdue.style.color = urgent ? "var(--red)" : "var(--muted)";
      if (urgent) pdue.style.fontWeight="800";
      pdue.textContent = (urgent?"🔴 ":"")+"Deadline: "+fmt(a.deadline);
      info.appendChild(pdue);
      var badges = div("punch-badges");
      var statusBadge = div("pbadge "+(closed?"pbadge-closed":"pbadge-open")); statusBadge.textContent=closed?"Closed":"Open";
      badges.appendChild(statusBadge);
      if (tl) { var tb=div("pbadge pbadge-time"); tb.textContent="⏱ "+tl; badges.appendChild(tb); }
      info.appendChild(badges);
      top.appendChild(info);

      var pb = document.createElement("button");
      pb.textContent = done ? "Checked In ✓" : closed ? "Closed" : "Check In";
      pb.className = "punch-btn "+(done?"stamped":closed?"over":"can");
      if (done||closed) pb.disabled=true;
      pb.onclick = function(){ stampAssignment(a.id); };
      top.appendChild(pb);
      card.appendChild(top);

      // Divider + footer
      card.appendChild(div("punch-divider"));
      var footer = div("punch-footer");
      var ftxt = div("punch-footer-txt"); ftxt.textContent=a.checkins.length+"/"+state.members.length+" members stamped "+(expanded?"▲":"▼");
      var fpct = div(""); fpct.style.cssText="font-size:11px;font-weight:800;color:"+(pct===100?"var(--green)":"var(--orange)");
      fpct.textContent=pct+"%";
      footer.appendChild(ftxt); footer.appendChild(fpct);
      footer.onclick=function(){ expandedId=expandedId===a.id?null:a.id; renderPanel(); };
      card.appendChild(footer);

      // Expanded member list
      if (expanded) {
        var mlist = div("punch-members");
        state.members.forEach(function(m) {
          var c = a.checkins.indexOf(m.name)>-1;
          var late = closed&&!c;
          var tag = div("pmtag "+(late?"pmtag-miss":c?"pmtag-done":"pmtag-pend"));
          tag.textContent = (late?"✗":c?"✓":"○")+" "+m.name;
          mlist.appendChild(tag);
        });
        card.appendChild(mlist);
      }
      body.appendChild(card);
    });
  }
  wrap.appendChild(body);
}

function stampAssignment(id) {
  var a = state.assignments.find(function(x){ return x.id===id; });
  if (!a) return;
  if (isClosed(a)) { toast("Deadline passed - assignment is closed.","error"); return; }
  if (a.checkins.indexOf(panelMember)>-1) { toast("Already stamped!","info"); return; }
  a.checkins.push(panelMember);
  save(); toast(a.title+" stamped!"); renderPanel();
}

// ── ADMIN PIN ────────────────────────────────────────
var ADMIN_PIN = "0000";

document.getElementById("admin-btn").onclick = function() {
  if (adminUnlocked) { renderAdmin(); document.getElementById("ov-admin").classList.add("open"); return; }
  var wrap = document.getElementById("pin-wrap");
  wrap.innerHTML="";
  adminEntered="";
  var ui = makePinUI("ADMIN", "Enter Admin PIN to continue", handleAdminKey, false);
  ui.querySelector(".pin-title").style.color="var(--orange)";
  var hint2=div("pin-hint"); hint2.textContent="Default PIN: 0000"; ui.appendChild(hint2);
  wrap.appendChild(ui);
  document.getElementById("ov-pin").classList.add("open");
};

function handleAdminKey(k) {
  if (k==="DEL") { adminEntered=adminEntered.slice(0,-1); updatePinDots(adminEntered); return; }
  if (adminEntered.length>=4) return;
  adminEntered+=String(k); updatePinDots(adminEntered);
  if (adminEntered.length===4) setTimeout(checkAdminPin,120);
}

function checkAdminPin() {
  if (adminEntered===ADMIN_PIN) {
    adminUnlocked=true; closeOverlay("ov-pin");
    renderAdmin(); document.getElementById("ov-admin").classList.add("open");
  } else {
    showPinError("Wrong PIN. Try again."); adminEntered="";
  }
}

document.getElementById("btn-close-admin").onclick = function(){ closeOverlay("ov-admin"); };

// ── ADMIN PANEL ──────────────────────────────────────
function renderAdmin() {
  // Assignments
  var aList = document.getElementById("admin-assign-list");
  aList.innerHTML="";
  if (!state.assignments.length) {
    var e=div(""); e.style.cssText="color:var(--muted);font-size:12px;padding:6px 0"; e.textContent="No assignments yet."; aList.appendChild(e);
  } else {
    state.assignments.forEach(function(a) {
      var dl = new Date(a.deadline);
      var localDL = new Date(dl.getTime()-dl.getTimezoneOffset()*60000).toISOString().slice(0,16);
      var wrap2 = div(""); wrap2.style.cssText="border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden";
      var row = div("admin-row"); row.style.padding="10px 12px";
      var info = div(""); info.style.flex="1";
      var t=div(""); t.style.cssText="font-weight:700;font-size:13px"; t.textContent=a.title; info.appendChild(t);
      var d=div(""); d.style.cssText="font-size:11px;color:var(--muted)"; d.textContent="Deadline: "+fmt(a.deadline); info.appendChild(d);
      var c=div(""); c.style.cssText="font-size:11px;color:var(--muted)"; c.textContent=a.checkins.length+" check-in(s)"; info.appendChild(c);
      row.appendChild(info);
      var btns = div(""); btns.style.cssText="display:flex;gap:6px";
      var editBtn = document.createElement("button"); editBtn.className="btn"; editBtn.style.cssText="background:#eff6ff;color:#2d3280;font-size:11px;padding:5px 10px"; editBtn.textContent="Edit";
      editBtn.onclick=function(){
        var f=document.getElementById("ef-"+a.id);
        f.style.display=f.style.display==="none"?"block":"none";
      };
      btns.appendChild(editBtn);
      var statusBtn = document.createElement("button"); statusBtn.className="btn"; statusBtn.style.cssText="font-size:11px;padding:5px 10px";
      if (isClosed(a)) { statusBtn.style.cssText+="background:#dcfce7;color:var(--green)"; statusBtn.textContent="Re-open"; }
      else { statusBtn.style.cssText+="background:#fee2e2;color:var(--red)"; statusBtn.textContent="Close"; }
      statusBtn.onclick=function(){
        if (isClosed(a)){a.forceOpen=true;a.forceClosed=false;toast("Re-opened!");}
        else{a.forceClosed=true;a.forceOpen=false;toast("Closed.");}
        save(); renderAdmin(); renderLockers();
      };
      btns.appendChild(statusBtn);
      var delBtn = document.createElement("button"); delBtn.className="btn btn-red"; delBtn.style.cssText="font-size:11px;padding:5px 10px"; delBtn.textContent="Remove";
      delBtn.onclick=function(){ state.assignments=state.assignments.filter(function(x){return x.id!==a.id;}); save(); toast("Removed."); renderAdmin(); renderLockers(); };
      btns.appendChild(delBtn);
      row.appendChild(btns);
      wrap2.appendChild(row);
      // Edit form
      var form = div(""); form.id="ef-"+a.id; form.style.cssText="display:none;background:var(--paper);padding:12px;border-top:1px solid var(--border)";
      var ti = document.createElement("input"); ti.type="text"; ti.value=a.title; ti.style.marginBottom="8px"; form.appendChild(ti);
      var di = document.createElement("input"); di.type="datetime-local"; di.value=localDL; di.style.marginBottom="10px"; form.appendChild(di);
      var savBtn=document.createElement("button"); savBtn.className="btn btn-navy"; savBtn.style.cssText="font-size:12px;margin-right:8px"; savBtn.textContent="Save";
      savBtn.onclick=function(){
        var nT=ti.value.trim(), nD=di.value;
        if(!nT||!nD){toast("Fill both fields.","error");return;}
        a.title=nT; a.deadline=new Date(nD).toISOString();
        save(); toast("Updated!"); renderAdmin(); renderLockers();
        if(panelMember&&document.getElementById("ov-panel").classList.contains("open"))renderPanel();
      };
      form.appendChild(savBtn);
      wrap2.appendChild(form);
      aList.appendChild(wrap2);
    });
  }
  // Members
  var mList = document.getElementById("admin-member-list");
  mList.innerHTML="";
  if (!state.members.length) {
    var e2=div(""); e2.style.cssText="color:var(--muted);font-size:12px;padding:6px 0"; e2.textContent="No members yet."; mList.appendChild(e2);
  } else {
    state.members.forEach(function(m,i) {
      var row2=div("admin-row");
      var info2=div(""); info2.style.cssText="display:flex;align-items:center;gap:8px;flex:1";
      var num=div(""); num.style.cssText="font-size:11px;color:var(--muted)"; num.textContent=String(i+1).padStart(2,"0"); info2.appendChild(num);
      var nm2=div(""); nm2.style.cssText="font-weight:700;font-size:13px"; nm2.textContent=m.name; info2.appendChild(nm2);
      var ps=div(""); ps.style.cssText="font-size:10px;color:var(--muted)"; ps.textContent=m.pin?"PIN set":"No PIN"; info2.appendChild(ps);
      row2.appendChild(info2);
      var db2=document.createElement("button"); db2.className="btn btn-red"; db2.style.cssText="font-size:11px;padding:5px 10px"; db2.textContent="Remove";
      db2.onclick=function(){ state.members=state.members.filter(function(x){return x.name!==m.name;}); save(); toast(m.name+" removed."); renderAdmin(); renderLockers(); };
      row2.appendChild(db2);
      mList.appendChild(row2);
    });
  }
}

document.getElementById("btn-add-assign").onclick = function() {
  var t=document.getElementById("a-title").value.trim(), d=document.getElementById("a-deadline").value;
  if(!t||!d){toast("Fill in title and deadline.","error");return;}
  state.assignments.push({id:Date.now(),title:t,deadline:new Date(d).toISOString(),checkins:[]});
  document.getElementById("a-title").value=""; document.getElementById("a-deadline").value="";
  save(); toast("Assignment added!"); renderAdmin(); renderLockers();
};

document.getElementById("btn-add-member").onclick = function() {
  var n=document.getElementById("a-member").value.trim(); if(!n)return;
  if(state.members.find(function(m){return m.name===n;})){toast("Name already exists.","error");return;}
  state.members.push({name:n,pin:""});
  document.getElementById("a-member").value="";
  save(); toast(n+" added!"); renderAdmin(); renderLockers();
};
document.getElementById("a-member").onkeydown=function(e){if(e.key==="Enter")document.getElementById("btn-add-member").click();};

// ── EXPORT ───────────────────────────────────────────
document.getElementById("btn-open-export").onclick = function() {
  var sel=document.getElementById("export-select");
  sel.innerHTML=""; 
  var opt=document.createElement("option"); opt.value="all"; opt.textContent="All Assignments"; sel.appendChild(opt);
  state.assignments.forEach(function(a){ var o=document.createElement("option"); o.value=a.id; o.textContent=a.title; sel.appendChild(o); });
  document.getElementById("ov-export").classList.add("open");
  updateExport();
};
document.getElementById("export-select").onchange=updateExport;
document.getElementById("btn-close-export").onclick=function(){closeOverlay("ov-export");};
document.getElementById("btn-close-export2").onclick=function(){closeOverlay("ov-export");};
document.getElementById("btn-copy-export").onclick=function(){
  navigator.clipboard.writeText(document.getElementById("export-text").value).then(function(){toast("Copied!");}).catch(function(){document.getElementById("export-text").select();document.execCommand("copy");toast("Copied!");});
};
document.getElementById("btn-dl-export").onclick=function(){
  var blob=new Blob([document.getElementById("export-text").value],{type:"text/plain"});
  var url=URL.createObjectURL(blob); var a=document.createElement("a");
  a.href=url; a.download="SCG_Report_"+new Date().toISOString().slice(0,10)+".txt"; a.click(); URL.revokeObjectURL(url); toast("Downloaded!");
};

function updateExport(){
  var id=document.getElementById("export-select").value;
  var now=new Date().toLocaleString("en-GB");
  var line="================================================";
  var out=line+"
SAFETY CAMPAIGN GHANA - MENTORSHIP PROGRAMME 2026
Assignment Check-In Report
Generated: "+now+"
"+line;
  function rep(a){
    var closed=isClosed(a), done=a.checkins.slice();
    var missing=state.members.filter(function(m){return done.indexOf(m.name)<0;}).map(function(m){return m.name;});
    var pct=state.members.length?Math.round(done.length/state.members.length*100):0;
    return "

Assignment: "+a.title+"
Status   : "+(closed?"CLOSED":"OPEN")+"
Deadline : "+fmt(a.deadline)+"
Progress : "+done.length+"/"+state.members.length+" ("+pct+"%)

Completed ("+done.length+"):
"+(done.length?done.map(function(n){return "  - "+n;}).join("
"):"  (none)")+"

"+(closed?"Did NOT submit":"Pending")+" ("+missing.length+"):
"+(missing.length?missing.map(function(n){return "  - "+n;}).join("
"):"  (all done!)")+"
";
  }
  if(id==="all"){ out+=state.assignments.map(rep).join("
"+line); }
  else{ var found=state.assignments.find(function(a){return String(a.id)===String(id);}); if(found)out+=rep(found); }
  document.getElementById("export-text").value=out;
}

// ── OVERLAYS ─────────────────────────────────────────

["ov-pin","ov-panel","ov-admin","ov-export"].forEach(function(id){
  document.getElementById(id).addEventListener("click",function(e){ if(e.target===this) closeOverlay(id); });
});
